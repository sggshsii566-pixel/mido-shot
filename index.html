body { background: #0b0f0c; }

.shot-page {
    background: #0b0f0c;
    color: #f2f7f2;
    min-height: 100vh;
    padding: 0 16px 28px;
    box-sizing: border-box;
    max-width: 760px;
    margin: 0 auto;
    font-family: inherit;
}

.shot-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 14px 0 18px;
    position: sticky;
    top: 0;
    background: #0b0f0c;
    z-index: 5;
}
.shot-nav-btn {
    flex: 1 1 28%;
    text-align: center;
    padding: 10px 6px;
    min-height: 44px;
    box-sizing: border-box;
    border: 1px solid #24401f;
    border-radius: 999px;
    background: #121a13;
    color: #f2f7f2;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.shot-nav-btn[aria-current="page"] {
    background: #22e06c;
    border-color: #22e06c;
    color: #07130a;
}

.shot-hero { position: relative; background-size: cover; background-position: center; border-radius: 18px; overflow: hidden; border: 1px solid #24401f; }
.shot-hero-overlay {
    background: linear-gradient(180deg, rgba(7,14,8,.45), rgba(7,14,8,.94));
    padding: 34px 20px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
}
.shot-avatar {
    width: 132px; height: 132px; object-fit: cover; object-position: 50% 12%;
    border-radius: 50%; border: 3px solid #22e06c; background: #121a13;
}
.shot-hero-name { font-size: 34px; font-weight: 800; color: #22e06c; }
.shot-hero-sub { color: #cfe6cf; font-size: 15px; }

.shot-intro { color: #b9c9ba; font-size: 15px; line-height: 1.9; margin: 18px 4px; }

.shot-home-links { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
.shot-big-btn {
    display: block; text-align: center; padding: 18px 16px; min-height: 44px; box-sizing: border-box;
    background: #22e06c; color: #07130a; font-size: 18px; font-weight: 800;
    border-radius: 16px; text-decoration: none;
}
.shot-big-btn + .shot-big-btn { background: #121a13; color: #22e06c; border: 2px solid #22e06c; }

.shot-section { margin-top: 8px; }
.shot-heading { color: #ffffff; font-size: 22px; font-weight: 800; margin: 10px 4px 12px; }
.shot-status { color: #93a893; font-size: 12.5px; margin: 0 4px 10px; line-height: 1.8; }
.shot-status a { color: #7cc793; text-decoration: underline; text-underline-offset: 2px; }
.shot-empty { color: #9fb3a2; font-size: 14px; margin: 0 4px; }
.shot-note {
    color: #e8d9a0; font-size: 13px; line-height: 1.9;
    background: #1a1607; border: 1px solid #4a4013; border-radius: 12px; padding: 12px 14px; margin: 14px 0 0;
}

.shot-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 10px; }
.shot-chip {
    border: 1px solid #24401f; background: #121a13; color: #f2f7f2;
    border-radius: 999px; padding: 7px 16px; font-size: 14px; cursor: pointer; min-height: 44px;
}
.shot-chip.is-active { background: #22e06c; color: #07130a; border-color: #22e06c; font-weight: 700; }
.shot-chip.shot-refresh { margin-inline-start: auto; background: transparent; border-color: #22e06c; color: #22e06c; }

.shot-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.shot-item {
    background: #121a13; border: 1px solid #24401f; border-radius: 14px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 6px;
}
.shot-item-title { font-weight: 700; font-size: 15.5px; line-height: 1.7; color: #ffffff; }
.shot-item-meta { color: #9fb3a2; font-size: 12.5px; line-height: 1.7; }
.shot-item-link { color: #7cc793; font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; font-weight: 500; }
.shot-item-link:hover { text-decoration: underline; }

.shot-footer { color: #7d8f80; font-size: 12.5px; line-height: 1.9; margin-top: 26px; padding-top: 14px; border-top: 1px solid #1c2b1e; }

.shot-heading-egy { margin-top: 30px; padding-top: 22px; border-top: 1px solid #1c2b1e; }
.shot-credit { margin-top: 10px; font-size: 14px; font-weight: 700; color: #23e07a; letter-spacing: 0.5px; }
.shot-subheading { font-size: 17px; font-weight: 700; color: #e8f5ec; margin: 22px 0 10px; }
.shot-item-dispute { display: block; font-size: 12.5px; color: #f0b429; margin-top: 4px; line-height: 1.7; }
.shot-table { list-style: none; margin: 0 0 18px; padding: 0; }
.shot-table-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid #1c2b1e; border-radius: 12px; margin-bottom: 6px; background: #0d1710; font-size: 14px; }
.shot-rank { min-width: 26px; height: 26px; border-radius: 50%; background: #122417; color: #23e07a; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }
.shot-team { flex: 1; color: #e8f5ec; font-weight: 600; }
.shot-played { color: #7d8f80; font-size: 12.5px; }
.shot-points { color: #23e07a; font-weight: 700; font-size: 13.5px; }
.shot-league { font-size: 14.5px; font-weight: 700; color: #a9c4ae; margin: 18px 0 8px; }
.shot-big-btn-alt { margin-top: 12px; }
.shot-search { width: 100%; box-sizing: border-box; background: #0d1710; border: 1px solid #1c2b1e; border-radius: 12px; color: #e8f5ec; padding: 10px 14px; font-size: 14.5px; margin: 6px 0 12px; font-family: inherit; }
.shot-search:focus { outline: 2px solid #23e07a; }
.shot-team-row { display: flex; align-items: center; gap: 8px; }
.shot-star { background: none; border: none; font-size: 22px; color: #4a6350; cursor: pointer; padding: 4px 6px; }
.shot-star.is-fav { color: #23e07a; }
.shot-star:disabled { opacity: 0.4; cursor: default; }
.shot-team-open { flex: 1; background: none; border: none; text-align: right; cursor: pointer; padding: 0; font-family: inherit; display: flex; flex-direction: column; gap: 4px; }
.shot-team-matches { margin-top: 10px; border-top: 1px dashed #1c2b1e; padding-top: 10px; }
.shot-team-match { display: flex; flex-direction: column; gap: 3px; padding: 8px 0; }

.shot-fs-small { zoom: 0.88; }
.shot-fs-large { zoom: 1.15; }
.shot-league-link { display: flex; flex-direction: column; gap: 6px; text-decoration: none; }

/* Match center: preserve MidoShot's dark pitch identity. */
.shot-match-open { display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; width:100%; padding:8px 0; min-height:48px; border:0; background:transparent; color:inherit; font:inherit; font-weight:700; text-align:start; cursor:pointer; }
.shot-match-open:hover { color:#94efac; }
.shot-match-cta { font-size:12px; color:#93dda4; font-weight:500; }
.shot-center-hint { color:#a9c7b0; line-height:1.9; border-inline-start:3px solid #4fd578; padding-inline-start:14px; }
.shot-center-back { margin-bottom:22px; }
.shot-center-eyebrow { font-size:12px; color:#93dda4; margin-bottom:12px; }
.shot-center-title { margin:0 0 24px; font-size:clamp(23px,5vw,34px); line-height:1.6; overflow-wrap:anywhere; }
.shot-center-title span { color:#73947c; }
.shot-scorecard { padding:24px 16px; border:1px solid #284933; border-radius:18px; background:linear-gradient(145deg,#142b1b,#101a13); text-align:center; line-height:1.8; }
.shot-match-status { display:inline-block; border:1px solid #49624f; padding:3px 13px; border-radius:20px; font-size:12px; color:#bed0c3; }
.shot-match-status.is-live { color:#99f4b4; border-color:#5cbe79; }
.shot-center-score { font-size:48px; line-height:1.3; font-weight:800; letter-spacing:3px; padding:10px; }
.shot-scorecard p { color:#a9bcae; font-size:12px; margin:8px 0; }
.shot-center-tabs { display:flex; gap:8px; flex-wrap:wrap; margin:24px 0 16px; }
.shot-center-tabs button { flex:1; min-height:46px; white-space:normal; }
.shot-center-source { font-size:12px; line-height:1.9; color:#a3baa9; margin-bottom:24px; }
.shot-center-source button { display:block; margin-top:12px; }
.shot-center-source a { color:#9be8b0; }
.shot-center-empty { padding:22px 18px; background:#141e17; color:#b9c9be; border-radius:12px; line-height:1.9; }
.shot-center-events { padding:0; margin:0; list-style:none; }
.shot-center-events li { display:grid; grid-template-columns:54px minmax(0,1fr); gap:12px; padding:18px 0; border-bottom:1px solid #23382a; }
.shot-center-events li > b { color:#91e4a7; font-size:14px; text-align:center; }
.shot-center-events li strong,.shot-center-events li span,.shot-center-events li small { display:block; }
.shot-center-events li span { color:#9eb6a5; font-size:12px; margin:5px 0; }
.shot-center-events li p,.shot-center-events li small { font-size:13px; line-height:1.8; color:#bdcdc2; margin:8px 0 0; overflow-wrap:anywhere; }
.shot-lineup-grid { display:grid; grid-template-columns:1fr; gap:16px; }
.shot-lineup-team { padding:16px; border:1px solid #294232; border-radius:14px; min-width:0; }
.shot-lineup-team h4 { margin:0 0 16px; font-size:18px; color:#9ae7af; }
.shot-lineup-team h5 { margin:18px 0 8px; color:#b7cabc; }
.shot-lineup-team ul { list-style:none; padding:0; }
.shot-lineup-team li { display:flex; align-items:center; gap:9px; min-height:44px; border-bottom:1px solid #213528; font-size:13px; }
.shot-lineup-team li > span:nth-child(2) { flex:1; overflow-wrap:anywhere; }
.shot-lineup-team small { color:#96aa9c; }
.shot-jersey { display:inline-grid; place-items:center; min-width:26px; height:26px; background:#203e29; border-radius:7px; color:#abebbd; font-weight:700; }
@media(min-width:620px) { .shot-lineup-grid { grid-template-columns:1fr 1fr; } }
.shot-center button:focus-visible,.shot-match-open:focus-visible { outline:2px solid #a5edb8; outline-offset:4px; }
