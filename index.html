body { background: #0b0f0c; }

.shot-page {
    background: #0b0f0c;
    color: #f2f7f2;
    min-height: 100vh;
    padding: 0 16px 28px;
    box-sizing: border-box;
    max-width: 760px;
    margin: 0 auto;
    font-family: inherit;
}

.shot-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 14px 0 18px;
    position: sticky;
    top: 0;
    background: #0b0f0c;
    z-index: 5;
}
.shot-nav-btn {
    flex: 1 1 28%;
    text-align: center;
    padding: 10px 6px;
    min-height: 44px;
    box-sizing: border-box;
    border: 1px solid #24401f;
    border-radius: 999px;
    background: #121a13;
    color: #f2f7f2;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.shot-nav-btn[aria-current="page"] {
    background: #22e06c;
    border-color: #22e06c;
    color: #07130a;
}

.shot-hero { position: relative; background-size: cover; background-position: center; border-radius: 18px; overflow: hidden; border: 1px solid #24401f; }
.shot-hero-overlay {
    background: linear-gradient(180deg, rgba(7,14,8,.45), rgba(7,14,8,.94));
    padding: 34px 20px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
}
.shot-avatar {
    width: 132px; height: 132px; object-fit: cover; object-position: 50% 12%;
