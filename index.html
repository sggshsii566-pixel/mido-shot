:root {
    --bg: #0a0f1e;
    --bg-2: #0e1730;
    --card: rgba(148, 178, 255, 0.055);
    --card-2: rgba(148, 178, 255, 0.1);
    --line: rgba(148, 178, 255, 0.14);
    --line-soft: rgba(148, 178, 255, 0.08);
    --text: #eef2ff;
    --muted: #97a6cf;
    --gold: #ffc94d;
    --gold-2: #ffb41f;
    --gold-ink: #241a02;
    --gold-soft: rgba(255, 201, 77, 0.14);
    --sky: #6cb8ff;
    --danger: #ff7b7b;
    --radius: 16px;
    --radius-lg: 22px;
}

html, body, #root { margin: 0; min-height: 100%; }
body { background: var(--bg); }

.shot-page {
    color: var(--text);
    min-height: 100vh;
    padding: 70px 16px 40px;
    box-sizing: border-box;
    max-width: 720px;
    margin: 0 auto;
    font-family: inherit;
    background:
        radial-gradient(420px 300px at 85% -40px, rgba(255, 201, 77, 0.09), transparent 70%),
        radial-gradient(500px 380px at 10% 120px, rgba(108, 184, 255, 0.07), transparent 70%);
}

a { color: var(--sky); }
button { font-family: inherit; }

/* ===== \u0627\u0644\u0642\u0627\u0626\u0645\u0629 \u0627\u0644\u062C\u0627\u0646\u0628\u064A\u0629 ===== */
.shot-nav { position: fixed; top: 12px; inset-inline-start: 12px; z-index: 30; }
.shot-menu-fab {
    width: 50px; height: 50px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    border: none; color: var(--gold-ink);
    font-size: 22px; font-weight: 700; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(255, 180, 31, 0.35), 0 2px 6px rgba(0, 0, 0, 0.5);
    transition: transform 0.15s ease;
}
.shot-menu-fab:active { transform: scale(0.92); }

.shot-drawer-overlay {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(4, 7, 16, 0.6);
    backdrop-filter: blur(3px);
}
.shot-drawer {
    position: fixed; top: 0; bottom: 0; inset-inline-end: 0; z-index: 41;
    width: min(84vw, 320px);
    background: linear-gradient(180deg, #101a36 0%, #0b1126 100%);
    border-inline-start: 1px solid var(--line);
    box-shadow: -18px 0 50px rgba(0, 0, 0, 0.55);
    display: flex; flex-direction: column;
    padding: 14px 14px 22px;
    overflow-y: auto;
    animation: shotDrawerIn 0.28s cubic-bezier(0.2, 0.9, 0.25, 1);
}
@keyframes shotDrawerIn { from { transform: translateX(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
[dir="rtl"] .shot-drawer { animation-name: shotDrawerInRtl; }
@keyframes shotDrawerInRtl { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }

.shot-drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; padding: 2px 4px;
}
.shot-drawer-title { font-weight: 800; font-size: 15px; color: var(--gold); letter-spacing: 0.02em; }
.shot-drawer-close {
    width: 38px; height: 38px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    font-size: 16px; cursor: pointer;
}
.shot-drawer-close:active { transform: scale(0.94); }

.shot-drawer nav, .shot-drawer .shot-nav-list { display: flex; flex-direction: column; gap: 8px; }
.shot-nav-btn {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 14px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--line-soft);
    color: var(--text); text-decoration: none; font-size: 15px; font-weight: 600;
    cursor: pointer; text-align: start;
    transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
}
.shot-nav-btn svg { width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 1.7; flex-shrink: 0; }
.shot-nav-btn:active { transform: scale(0.98); }
.shot-nav-btn.active, .shot-nav-btn[aria-current="page"] {
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    border-color: transparent; color: var(--gold-ink); font-weight: 800;
}
.shot-nav-btn.active svg, .shot-nav-btn[aria-current="page"] svg { stroke: var(--gold-ink); }

/* ===== \u0627\u0644\u062F\u062E\u0648\u0644 ===== */
.shot-auth-btn { margin-top: 10px; }
.shot-auth-avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
.shot-auth-name { font-weight: 700; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shot-auth-action { font-weight: 700; }
.shot-auth-g { width: 18px; height: 18px; flex-shrink: 0; }
.shot-auth-notice {
    margin: 10px 4px 0; padding: 12px 14px;
    border: 1px solid rgba(255, 201, 77, 0.35); border-radius: 14px;
    background: rgba(255, 201, 77, 0.09); color: #ffd98f;
    font-size: 13px; line-height: 1.8;
}

/* ===== \u0627\u0644\u0647\u064A\u0631\u0648 / \u0627\u0644\u062A\u0631\u062D\u064A\u0628 ===== */
.shot-hero {
    position: relative;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background-size: cover; background-position: center;
    border: 1px solid var(--line);
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5);
}
.shot-hero-overlay {
    position: relative;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: 10px;
    padding: 44px 20px 40px;
    background: linear-gradient(180deg, rgba(8, 12, 26, 0.55) 0%, rgba(8, 12, 26, 0.82) 78%);
}
.shot-avatar {
    width: 84px; height: 84px; border-radius: 50%; object-fit: cover;
    border: 3px solid var(--gold);
    box-shadow: 0 0 0 5px rgba(255, 201, 77, 0.18), 0 10px 26px rgba(0, 0, 0, 0.5);
    animation: shotHeroIn 0.7s cubic-bezier(0.2, 0.9, 0.25, 1) both;
}
.shot-hero-name {
    font-size: 27px; font-weight: 800; line-height: 1.5;
    background: linear-gradient(120deg, #fff 20%, var(--gold) 55%, #fff 85%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shotHeroIn 0.7s 0.08s cubic-bezier(0.2, 0.9, 0.25, 1) both, shotHeroGlow 4.5s 0.9s ease-in-out infinite;
}
.shot-hero-sub {
    color: #cdd8f5; font-size: 14.5px; line-height: 1.9; max-width: 40ch;
    animation: shotHeroIn 0.7s 0.16s cubic-bezier(0.2, 0.9, 0.25, 1) both;
}
@keyframes shotHeroIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes shotHeroGlow {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(255, 201, 77, 0)); }
    50% { filter: drop-shadow(0 0 14px rgba(255, 201, 77, 0.35)); }
}

.shot-intro { color: var(--muted); font-size: 14px; line-height: 1.95; margin: 20px 6px 14px; }

/* ===== \u0628\u0637\u0627\u0642\u0627\u062A \u0627\u0644\u0631\u0626\u064A\u0633\u064A\u0629 ===== */
.shot-home-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
    margin-top: 6px;
}
.shot-home-card {
    display: flex; flex-direction: column; align-items: flex-start; gap: 14px;
    padding: 18px 16px; min-height: 108px; box-sizing: border-box;
    background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius-lg);
    color: var(--text); text-decoration: none; font-size: 15px; font-weight: 700;
    transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
    animation: shotHeroIn 0.5s both;
}
.shot-home-grid .shot-home-card:nth-child(2) { animation-delay: 0.05s; }
.shot-home-grid .shot-home-card:nth-child(3) { animation-delay: 0.1s; }
.shot-home-grid .shot-home-card:nth-child(4) { animation-delay: 0.15s; }
.shot-home-grid .shot-home-card:nth-child(5) { animation-delay: 0.2s; }
.shot-home-grid .shot-home-card:nth-child(6) { animation-delay: 0.25s; }
.shot-home-grid .shot-home-card:nth-child(7) { animation-delay: 0.3s; }
.shot-home-card svg {
    width: 46px; height: 46px; padding: 10px; box-sizing: border-box;
    border-radius: 14px;
    background: var(--gold-soft); stroke: var(--gold); fill: none; stroke-width: 1.7;
}
.shot-home-card:active { transform: scale(0.96); }
@media (hover: hover) {
    .shot-home-card:hover { border-color: rgba(255, 201, 77, 0.45); background: var(--card-2); }
}

/* ===== \u0627\u0644\u0639\u0646\u0627\u0648\u064A\u0646 ===== */
.shot-section { margin-top: 26px; }
.shot-heading {
    display: flex; align-items: center; gap: 10px;
    font-size: 21px; font-weight: 800; margin: 0 0 14px;
}
.shot-heading::before {
    content: ''; width: 5px; height: 22px; border-radius: 3px;
    background: linear-gradient(180deg, var(--gold), var(--gold-2));
    box-shadow: 0 0 12px rgba(255, 201, 77, 0.45);
    flex-shrink: 0;
}
.shot-heading-egy { margin-top: 30px; }
.shot-subheading { font-size: 16.5px; font-weight: 800; margin: 20px 0 10px; color: var(--text); }

.shot-back {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); text-decoration: none; font-size: 13.5px; font-weight: 600;
    padding: 7px 12px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--line-soft);
    margin-bottom: 14px;
}
.shot-back:active { transform: scale(0.97); }

/* ===== \u0627\u0644\u0642\u0648\u0627\u0626\u0645 \u0648\u0627\u0644\u0628\u0637\u0627\u0642\u0627\u062A ===== */
.shot-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.shot-item {
    display: flex; flex-direction: column; gap: 4px;
    padding: 14px 16px;
    background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius);
}
.shot-item-tap {
    position: relative;
    color: var(--text); text-decoration: none;
    padding-inline-end: 40px;
    transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
}
.shot-item-tap:active { transform: scale(0.98); }
@media (hover: hover) { .shot-item-tap:hover { border-color: rgba(255, 201, 77, 0.4); background: var(--card-2); } }
.shot-item-chevron {
    position: absolute; inset-inline-end: 14px; top: 50%; transform: translateY(-50%);
    color: var(--gold); font-size: 22px; font-weight: 700; line-height: 1;
}
.shot-item-title { font-weight: 700; font-size: 15px; line-height: 1.75; }
.shot-item-meta { color: var(--muted); font-size: 12.5px; line-height: 1.7; }
.shot-item-link { color: var(--gold); text-decoration: none; font-weight: 600; }
.shot-item-dispute { color: var(--danger); font-size: 12.5px; }

.shot-status { color: var(--muted); font-size: 13px; line-height: 1.9; margin: 10px 2px; }
.shot-status a { color: var(--gold); text-decoration: none; font-weight: 600; }
.shot-empty {
    padding: 16px; border: 1px dashed var(--line); border-radius: var(--radius);
    color: var(--muted); font-size: 14px; line-height: 1.9; text-align: center;
}
.shot-note {
    color: var(--muted); font-size: 12.5px; line-height: 1.9;
    padding: 12px 14px; background: var(--card); border-radius: 12px;
    border-inline-start: 3px solid var(--gold-soft);
    margin: 14px 0;
}

/* ===== \u0627\u0644\u0631\u0642\u0627\u0626\u0642 (chips) ===== */
.shot-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.shot-chip {
    padding: 9px 16px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line);
    color: var(--text); font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
}
.shot-chip:active { transform: scale(0.95); }
.shot-chip.is-active, .shot-chip[aria-selected="true"] {
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    border-color: transparent; color: var(--gold-ink); font-weight: 800;
}
.shot-refresh { margin-inline-start: auto; }

.shot-search {
    width: 100%; box-sizing: border-box;
    padding: 13px 16px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--line);
    color: var(--text); font-size: 15px; font-family: inherit;
    margin-bottom: 14px;
}
.shot-search:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255, 201, 77, 0.15); }
.shot-search::placeholder { color: var(--muted); }

/* ===== \u0642\u0627\u0631\u0626 \u0627\u0644\u062E\u0628\u0631 ===== */
.shot-reader-title { font-size: 22px; font-weight: 800; line-height: 1.8; margin: 4px 0 12px; }
.shot-reader-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 18px; color: var(--muted); font-size: 13px; }
.shot-reader-source {
    padding: 5px 12px; border-radius: 999px;
    background: var(--gold-soft); border: 1px solid rgba(255, 201, 77, 0.3);
    color: var(--gold); font-weight: 700; font-size: 12.5px;
}
.shot-reader-excerpt {
    background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius-lg);
    padding: 18px; font-size: 15.5px; line-height: 2.05; margin: 0 0 18px;
}
.shot-reader-none { color: var(--muted); font-size: 14px; }
.shot-reader-cta {
    display: block; text-align: center; text-decoration: none;
    padding: 15px 18px; border-radius: 14px;
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: var(--gold-ink); font-weight: 800; font-size: 15.5px;
    box-shadow: 0 8px 22px rgba(255, 180, 31, 0.28);
    transition: transform 0.12s ease;
}
.shot-reader-cta:active { transform: scale(0.97); }

/* ===== \u0627\u0644\u0641\u0631\u0642 ===== */
.shot-team-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
    list-style: none; margin: 0; padding: 0;
}
.shot-team-card {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 20px 12px 16px; text-align: center;
    background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius-lg);
    color: var(--text); text-decoration: none;
    transition: transform 0.12s ease, border-color 0.15s ease;
}
.shot-team-card:active { transform: scale(0.96); }
@media (hover: hover) { .shot-team-card:hover { border-color: rgba(108, 184, 255, 0.45); } }
.shot-team-card-name { font-weight: 700; font-size: 14px; line-height: 1.6; }

.shot-team-head {
    display: flex; align-items: center; gap: 16px;
    background: linear-gradient(135deg, rgba(255, 201, 77, 0.1), var(--card));
    border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 18px; margin-bottom: 16px;
}
.shot-team-head-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.shot-team-head-info .shot-heading { margin: 0; font-size: 19px; }
.shot-team-head-info .shot-heading::before { height: 18px; }

.shot-team-detail { display: flex; flex-direction: column; gap: 22px; }
.shot-team-matches, .shot-team-match { display: flex; flex-direction: column; gap: 10px; }

.shot-detail-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.shot-detail-item {
    position: relative;
    padding: 13px 16px;
    background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius);
}
.shot-detail-item summary { display: flex; flex-direction: column; gap: 3px; cursor: pointer; list-style: none; padding-inline-end: 24px; }
.shot-detail-item summary::-webkit-details-marker { display: none; }
.shot-detail-item summary::after {
    content: '\u25BE'; color: var(--gold); font-size: 13px;
    position: absolute; inset-inline-end: 12px; top: 13px;
    transition: transform 0.15s ease;
}
.shot-detail-item[open] summary::after { transform: rotate(180deg); }
.shot-detail-item[open] { border-color: rgba(255, 201, 77, 0.35); }
.shot-fixture-detail {
    display: flex; flex-direction: column; gap: 6px;
    margin-top: 10px; padding-top: 12px;
    border-top: 1px dashed var(--line);
}

/* ===== \u0627\u0644\u0644\u0627\u0639\u0628\u0648\u0646 ===== */
.shot-squad { display: flex; flex-direction: column; gap: 8px; }
.shot-squad-block { margin-bottom: 6px; }
.shot-squad-group {
    color: var(--gold); font-size: 13px; font-weight: 800;
    margin: 16px 2px 8px; letter-spacing: 0.02em;
}
.shot-squad-name, .shot-squad-player {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--line-soft);
    color: var(--text); text-decoration: none; font-size: 14px; font-weight: 600;
    transition: transform 0.1s ease, border-color 0.15s ease;
}
.shot-squad-player:active { transform: scale(0.98); }
@media (hover: hover) { .shot-squad-player:hover { border-color: rgba(108, 184, 255, 0.45); } }
.shot-player-avatar {
    width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    background: var(--bg-2); border: 2px solid var(--line);
}
.shot-player-badge {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--gold-soft); border: 2px solid rgba(255, 201, 77, 0.35);
    color: var(--gold); font-weight: 800; font-size: 14px;
}

.shot-avatar-img { border-radius: 50%; object-fit: cover; }
.shot-logo { object-fit: contain; flex-shrink: 0; }
.shot-logo-fallback {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%; background: var(--card-2); color: var(--gold);
    font-weight: 800; flex-shrink: 0;
}

/* ===== \u0627\u0644\u0645\u0627\u062A\u0634\u0627\u062A ===== */
.shot-match-open {
    display: flex; flex-direction: column; gap: 8px; width: 100%;
    padding: 14px 16px; text-align: start;
    background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius);
    color: var(--text); cursor: pointer; font-size: 14.5px; font-weight: 600;
    transition: transform 0.12s ease, border-color 0.15s ease;
}
.shot-match-open:active { transform: scale(0.98); }
@media (hover: hover) { .shot-match-open:hover { border-color: rgba(108, 184, 255, 0.45); } }
.shot-match-teams { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; line-height: 1.7; }
.shot-match-cta { color: var(--gold); font-size: 13px; font-weight: 700; }
.shot-played { color: var(--muted); font-size: 12.5px; }
.shot-league { color: var(--muted); font-size: 13px; }
.shot-league-link { color: var(--gold); text-decoration: none; font-weight: 700; }

/* ===== \u0645\u0631\u0643\u0632 \u0627\u0644\u0645\u0627\u062A\u0634 ===== */
.shot-center { margin-top: 18px; }
.shot-center-back { margin-bottom: 12px; }
.shot-center-title { font-size: 20px; font-weight: 800; margin: 0 0 4px; }
.shot-center-title:focus, .shot-center-title:focus-visible { outline: none; }
.shot-center-eyebrow { color: var(--gold); font-size: 12.5px; font-weight: 700; letter-spacing: 0.03em; }
.shot-center-hint { color: var(--muted); font-size: 12.5px; }
.shot-center-teams {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius-lg);
    padding: 20px 14px; margin: 14px 0;
}
.shot-center-team { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; font-size: 14px; text-align: center; }
.shot-center-score {
    font-size: 26px; font-weight: 800; color: var(--gold);
    padding: 8px 14px; border-radius: 14px; background: rgba(255, 201, 77, 0.08);
    border: 1px solid rgba(255, 201, 77, 0.25); white-space: nowrap;
}
.shot-center-tabs { display: flex; gap: 8px; margin: 14px 0; }
.shot-center-tabs .shot-chip { flex: 1; text-align: center; }
.shot-center-source { color: var(--muted); font-size: 12.5px; line-height: 2; margin: 8px 0; }
.shot-center-source a { color: var(--gold); text-decoration: none; }
.shot-center-events { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.shot-center-events li {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius);
    padding: 12px 14px;
}
.shot-center-events li > b { color: var(--gold); font-size: 13px; min-width: 40px; padding-top: 2px; }
.shot-center-events li > div { display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; }
.shot-center-events li span { color: var(--muted); font-size: 12.5px; }
.shot-center-events li small, .shot-center-events li p { color: var(--muted); font-size: 12.5px; margin: 0; line-height: 1.7; }
.shot-center-empty {
    padding: 16px; text-align: center;
    color: var(--muted); font-size: 13.5px; line-height: 1.9;
    background: var(--card); border-radius: var(--radius); border: 1px dashed var(--line);
}
.shot-match-status { color: var(--muted); font-size: 13px; font-weight: 700; }
.shot-match-status.is-live { color: #4ade80; }

.shot-badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 800; margin-inline-start: 8px; vertical-align: middle;
}
.shot-badge-official { background: rgba(74, 222, 128, 0.14); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
.shot-badge-predicted { background: var(--gold-soft); color: var(--gold); border: 1px solid rgba(255, 201, 77, 0.3); }

.shot-lineup-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 620px) { .shot-lineup-grid { grid-template-columns: 1fr 1fr; } }
.shot-lineup-team {
    background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius-lg);
    padding: 14px;
}
.shot-lineup-team h4 { margin: 0 0 6px; font-size: 15.5px; font-weight: 800; }
.shot-lineup-team h5 { color: var(--muted); font-size: 13px; margin: 14px 0 8px; }
.shot-lineup-team ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.shot-lineup-team ul li { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
.shot-lineup-team ul li small { color: var(--muted); }
.shot-formation { color: var(--gold); font-weight: 800; font-size: 13.5px; margin: 2px 0 10px; }
.shot-pred-base { color: var(--muted); font-size: 12px; line-height: 1.8; margin: 10px 0 0; }
.shot-coach, .shot-coach-inline { color: var(--muted); font-size: 12.5px; }
.shot-coach-note { color: var(--muted); font-size: 12px; line-height: 1.9; margin-top: 14px; }
.shot-photo-credits { color: var(--muted); font-size: 12px; margin-top: 10px; }
.shot-photo-credits summary { cursor: pointer; color: var(--gold); font-weight: 600; }
.shot-photo-credits ul { margin: 8px 0; padding-inline-start: 18px; line-height: 1.9; }
.shot-photo-credits a { color: var(--sky); }

/* \u0627\u0644\u0645\u0644\u0639\u0628 */
.shot-pitch {
    position: relative;
    background: linear-gradient(180deg, #123826 0%, #0d2c1e 100%);
    border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 14px;
    padding: 12px 8px; margin: 10px 0;
    display: flex; flex-direction: column; gap: 10px;
}
.shot-pitch-row { display: flex; justify-content: space-around; align-items: flex-start; gap: 4px; }
.shot-pitch-player { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 56px; text-align: center; }
.shot-pitch-player img, .shot-pitch-player .shot-player-badge { width: 34px; height: 34px; }
.shot-pitch-name { font-size: 10px; line-height: 1.4; color: #d7e8dd; word-break: break-word; }

/* ===== \u0627\u0644\u062A\u0631\u062A\u064A\u0628 \u0648\u0627\u0644\u0647\u062F\u0627\u0641\u0648\u0646 ===== */
.shot-table { width: 100%; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius); overflow: hidden; }
.shot-table-row, .shot-table tr { border-bottom: 1px solid var(--line-soft); }
.shot-table-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.shot-table-row:last-child { border-bottom: none; }
.shot-table-row .shot-team { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 13.5px; }
.shot-table-row .shot-played { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.shot-table-row .shot-points { white-space: nowrap; font-size: 13px; }
.shot-table th { color: var(--muted); font-size: 12px; font-weight: 700; padding: 10px 8px; text-align: start; }
.shot-table td { padding: 11px 8px; font-size: 13.5px; }
.shot-rank {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 8px;
    background: var(--card-2); color: var(--muted); font-weight: 800; font-size: 12px;
}
.shot-table tr:first-child td .shot-rank, .shot-table-row:first-child .shot-rank { background: var(--gold-soft); color: var(--gold); }
.shot-team-cell { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.shot-points { font-weight: 800; color: var(--gold); }
.shot-scorecard { display: flex; align-items: center; gap: 10px; }

/* ===== \u0645\u062A\u0641\u0631\u0642\u0627\u062A ===== */
.shot-credit, .shot-footer { color: var(--muted); font-size: 12px; line-height: 2; margin-top: 34px; text-align: center; }
.shot-footer a { color: var(--sky); text-decoration: none; }
.shot-social { display: flex; justify-content: center; gap: 12px; margin-top: 10px; }
.shot-ico { display: inline-flex; }
.shot-with-logos { display: flex; align-items: center; gap: 8px; }
.shot-btn-ghost, .shot-btn-primary {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 18px; border-radius: 12px; font-size: 14px; font-weight: 700;
    cursor: pointer; text-decoration: none; border: 1px solid var(--line);
}
.shot-btn-primary { background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: var(--gold-ink); border-color: transparent; }
.shot-btn-ghost { background: var(--card); color: var(--text); }
.shot-btn-primary:active, .shot-btn-ghost:active { transform: scale(0.97); }

@media (prefers-reduced-motion: reduce) {
    .shot-hero-name, .shot-avatar, .shot-hero-sub, .shot-home-card, .shot-drawer { animation: none !important; }
}

/* ===== \u062A\u063A\u0637\u064A\u0629 \u0643\u0644\u0627\u0633\u0627\u062A \u0646\u0627\u0642\u0635\u0629 ===== */
.shot-avatar-img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.shot-player-avatar.shot-player-badge { position: relative; overflow: hidden; display: inline-flex; }
.shot-player-avatar.shot-player-badge:has(.shot-avatar-img) { background: transparent; border-color: var(--line); }

.shot-team-cell { position: relative; display: block; }
.shot-team-cell .shot-team-card { height: 100%; box-sizing: border-box; }
.shot-star {
    position: absolute; top: 10px; inset-inline-start: 10px; z-index: 2;
    width: 36px; height: 36px; border-radius: 12px;
    background: var(--card-2); border: 1px solid var(--line);
    color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s ease, color 0.15s ease, border-color 0.15s ease;
}
.shot-star:active { transform: scale(0.9); }
.shot-star.is-fav { color: var(--gold); background: var(--gold-soft); border-color: rgba(108, 184, 255, 0.45); }
.shot-star:disabled { opacity: 0.45; cursor: default; }
.shot-team-head { position: relative; }
.shot-team-head > .shot-star { position: absolute; top: 12px; inset-inline-end: 12px; }

.shot-settings { display: flex; flex-direction: column; gap: 14px; }
.shot-settings label { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius); font-size: 14.5px; font-weight: 600; }
.shot-settings select, .shot-settings input[type="text"] {
    padding: 9px 12px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line);
    color: var(--text); font-family: inherit; font-size: 14px; max-width: 55%;
}
.shot-settings input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--gold); }
.shot-fs-small { font-size: 14px; }
.shot-fs-large { font-size: 17px; }

.shot-favorites { margin-top: 6px; }
.shot-detail-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.shot-logo-light { background: rgba(255, 255, 255, 0.92); border-radius: 50%; padding: 3px; }
.shot-photos-v { color: var(--muted); font-size: 12px; line-height: 1.8; }

/* ===== \u0634\u0639\u0627\u0631 MIDO ===== */
.shot-wordmark {
    display: flex; gap: 6px; justify-content: center; align-items: baseline;
    font-size: 54px; font-weight: 900; letter-spacing: 0.08em; line-height: 1;
    margin-bottom: 4px;
    animation: shotHeroIn 0.7s cubic-bezier(0.2, 0.9, 0.25, 1) both;
}
.shot-wordmark span {
    display: inline-block;
    background: linear-gradient(115deg, #fff8e6 10%, var(--gold) 38%, #b97f0a 52%, var(--gold) 66%, #fff8e6 90%);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 14px rgba(255, 180, 31, 0.3));
    animation: shotWordGlint 3.6s ease-in-out infinite;
}
.shot-wordmark span:nth-child(1) { animation-delay: 0s; }
.shot-wordmark span:nth-child(2) { animation-delay: 0.25s; }
.shot-wordmark span:nth-child(3) { animation-delay: 0.5s; }
.shot-wordmark span:nth-child(4) { animation-delay: 0.75s; }
@keyframes shotWordGlint {
    0%, 100% { background-position: 0% 0; transform: translateY(0); }
    50% { background-position: 100% 0; transform: translateY(-4px); }
}

.shot-reader-story { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
.shot-reader-byline { color: var(--gold); font-size: 12.5px; font-weight: 700; line-height: 1.8; }
.shot-reader-story .shot-reader-excerpt { margin: 0; }
.shot-reader-sources { color: var(--muted); font-size: 12.5px; }
.shot-reader-sources a { color: var(--sky); text-decoration: none; margin-inline-end: 8px; }

/* ===== 365 MIDO theme - black / blue / white, bottom nav ===== */
:root {
    --bg: #05080f;
    --bg-2: #0a111f;
    --card: rgba(88, 140, 255, 0.07);
    --card-2: rgba(88, 140, 255, 0.13);
    --line: rgba(120, 160, 255, 0.17);
    --line-soft: rgba(120, 160, 255, 0.09);
    --text: #f2f6ff;
    --muted: #8fa3c8;
    --gold: #2f81f7;
    --gold-2: #1f6feb;
    --gold-ink: #ffffff;
    --gold-soft: rgba(47, 129, 247, 0.17);
    --sky: #6cb8ff;
}
.shot-page {
    padding-top: 56px;
    padding-bottom: 108px;
    background:
        radial-gradient(420px 300px at 85% -40px, rgba(47, 129, 247, 0.12), transparent 70%),
        radial-gradient(500px 380px at 10% 120px, rgba(108, 184, 255, 0.06), transparent 70%);
}
.shot-topbar {
    position: fixed; top: 0; inset-inline: 0; z-index: 34;
    display: flex; align-items: center; justify-content: center;
    padding: 10px 14px;
    background: rgba(5, 8, 15, 0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line-soft);
}
.shot-topbar-brand { font-size: 18px; font-weight: 800; letter-spacing: 1px; color: var(--text); }
.shot-topbar-brand b { color: var(--sky); }
.shot-bottomnav {
    position: fixed; bottom: 0; inset-inline: 0; z-index: 35;
    display: flex; max-width: 720px; margin: 0 auto;
    background: rgba(8, 12, 22, 0.97);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0);
}
.shot-bnav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 9px 0 7px; color: var(--muted);
    font-size: 11px; font-weight: 600; text-decoration: none;
    background: none; border: none; cursor: pointer; font-family: inherit;
}
.shot-bnav-item.active { color: var(--sky); }
.shot-bnav-item.active .shot-ico { stroke-width: 2.2; }
.shot-bnav-item:active { color: var(--text); }
.shot-daypills { display: flex; gap: 8px; margin: 2px 0 14px; }
.shot-daypill {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 9px 6px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--card);
    color: var(--muted); cursor: pointer; font-family: inherit;
}
.shot-daypill b { font-size: 14px; color: var(--text); font-weight: 700; }
.shot-daypill span { font-size: 11px; }
.shot-daypill.on { background: var(--gold-soft); border-color: var(--gold); }
.shot-daypill.on b { color: var(--sky); }
.shot-daygroup { margin-bottom: 6px; }
.shot-drawer { background: #0a111f; }

/* ===== 365 MIDO pass 2: flat black, compact components ===== */
body { background: #05080f; }
.shot-page {
    background: radial-gradient(500px 260px at 50% -60px, rgba(47, 129, 247, 0.1), transparent 70%);
}
.shot-brand { text-align: center; margin: 20px 0 22px; }
.shot-wordmark365 { font-size: 34px; font-weight: 900; letter-spacing: 2px; color: var(--text); }
.shot-wordmark365 b { color: var(--sky); }
.shot-extrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0 14px; }
.shot-ext-btn {
    display: inline-block; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--gold); color: var(--sky); background: var(--gold-soft);
    text-decoration: none; font-size: 13px; font-weight: 700;
}
.shot-ext-tag { font-size: 11px; color: var(--muted); }
.shot-retry {
    margin-inline-start: 8px; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--gold); background: var(--gold-soft); color: var(--sky);
    font-weight: 700; cursor: pointer; font-family: inherit; font-size: 13px;
}
.shot-topbar-search { position: absolute; inset-inline-end: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); display: flex; padding: 4px; }
.shot-topbar-search:active { color: var(--sky); }
